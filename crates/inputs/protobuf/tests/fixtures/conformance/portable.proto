syntax = "proto3";
package poolster.conformance;
option go_package = "example.com/poolster/conformance/wire;wire";

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message ScalarValues {
  double double_value = 1;
  float float_value = 2;
  int64 int64_value = 3;
  uint64 uint64_value = 4;
  int32 int32_value = 5;
  fixed64 fixed64_value = 6;
  fixed32 fixed32_value = 7;
  bool bool_value = 8;
  string string_value = 9;
  bytes bytes_value = 10;
  uint32 uint32_value = 11;
  sfixed32 sfixed32_value = 12;
  sfixed64 sfixed64_value = 13;
  sint32 sint32_value = 14;
  sint64 sint64_value = 15;
  optional string optional_value = 16;
  repeated int32 packed_values = 17 [packed = true];
  repeated int32 unpacked_values = 18 [packed = false];
  map<string, uint64> counters = 19;
  map<int32, ScalarValues> children = 20;
  ScalarValues recursive = 21;
  oneof choice {
    string text = 22;
    int64 number = 23;
  }
  enum State {
    option allow_alias = true;
    UNKNOWN = 0;
    READY = 1;
    ACTIVE = 1;
  }
  State state = 24;
  string renamed = 25 [json_name = "displayName"];
}

message WellKnownValues {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.Duration duration = 2;
  google.protobuf.Any payload = 3;
  google.protobuf.Struct object = 4;
  google.protobuf.Value value = 5;
  google.protobuf.ListValue list = 6;
  google.protobuf.FieldMask mask = 7;
  google.protobuf.Int64Value signed = 8;
  google.protobuf.UInt64Value unsigned = 9;
  google.protobuf.DoubleValue double_value = 10;
  google.protobuf.FloatValue float_value = 11;
  google.protobuf.Int32Value int32_value = 12;
  google.protobuf.UInt32Value uint32_value = 13;
  google.protobuf.BoolValue bool_value = 14;
  google.protobuf.StringValue string_value = 15;
  google.protobuf.BytesValue bytes_value = 16;
  google.protobuf.Empty empty = 17;
}

service Conformance {
  rpc Echo(ScalarValues) returns (ScalarValues);
  rpc Watch(ScalarValues) returns (stream ScalarValues);
  rpc Upload(stream ScalarValues) returns (ScalarValues);
  rpc Chat(stream ScalarValues) returns (stream ScalarValues);
  rpc WellKnown(WellKnownValues) returns (WellKnownValues);
}
