syntax = "proto3";
package store.v1;
option go_package = "example.com/poolster/grpc/storev1;storev1";
import "google/protobuf/timestamp.proto";
import "legacy.proto";
message Item {
  message Detail { string value = 1; }
  string name = 1;
  optional string note = 2;
  oneof value { int32 count = 3; string text = 4; }
  map<string,string> labels = 5;
  enum State { UNKNOWN = 0; READY = 1; }
  State state = 6;
  google.protobuf.Timestamp created_at = 7;
  store.legacy.Legacy legacy = 8;
  Detail detail = 9;
  repeated Detail children = 10;
  map<string,Detail> details = 11;
}
