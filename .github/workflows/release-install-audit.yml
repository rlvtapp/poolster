name: Published package clean installs
on:
  workflow_dispatch:
  push:
    branches: [codex/release-verification-20261023]
    paths:
      - .github/workflows/release-install-audit.yml
      - scripts/release-install-check.py
permissions:
  contents: read
jobs:
  install:
    name: Install / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, platform: darwin-arm64}
          - {runner: macos-15-intel, platform: darwin-x64}
          - {runner: ubuntu-22.04, platform: linux-x64-gnu}
          - {runner: windows-latest, platform: win32-x64-msvc}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install registry packages and execute clean consumers
        shell: bash
        run: python scripts/release-install-check.py --output "$RUNNER_TEMP/poolster-installed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/poolster-installed/report.json
            ${{ runner.temp }}/poolster-installed/*.log
          retention-days: 14
