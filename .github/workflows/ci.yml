name: CI
on:
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
      - main
      - 0.5.0
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kafka:
    uses: ./.github/workflows/kafka-conformance.yml
  checks:
    name: Source, integration and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check authored source size ratchet
        run: python scripts/layout-audit.py --check-source-size
      - name: Test CI integration templates
        run: |
          node --test packages/integrations/github/test/*.test.cjs packages/integrations/gitlab/test/*.test.cjs
          python3 scripts/test-public-contracts.test.py
          python3 scripts/test-guru-corpus.py
          python3 scripts/test-kafka-conformance.py
          python3 scripts/test-publish-npm.py
      - name: Test editable SDK delivery and App broker sources
        run: node --test packages/internal/sdk-check/test/*.mjs packages/internal/sdk-publish/test/*.mjs packages/internal/github-app-broker/*.test.mjs packages/internal/spec-sync/test/*.test.mjs packages/internal/sdk-delivery-test/test/*.test.mjs packages/internal/runtime-contract/test.mjs packages/internal/postman-sync/test/*.mjs
      - name: Test portable collection checker
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python -m unittest discover -s packages/internal/postman-check/test -v
      - name: Test Python CLI launcher
        run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - name: Test workspace release version updates
        run: |
          python scripts/test-publish-crates.py
          python scripts/publish-crates.py --plan --tag "v$(cat version.txt)"
          npm install --prefix "$RUNNER_TEMP/poolster-release-check" --ignore-scripts --no-audit --no-fund release-please@17.6.0
          NODE_PATH="$RUNNER_TEMP/poolster-release-check/node_modules" node --test scripts/release-config.test.cjs
  rust-checks:
    name: Rust formatting and warning-denied lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all workspace targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recipe schema validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Build OpenAPI compiler for CLI integration tests
        working-directory: openapi
        run: go build -o ../target/debug/poolster-openapi .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
      - name: Run full workspace suite
        run: cargo test --workspace --locked
  cli-integration:
    name: CLI schema, references and migration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recipe schema validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Build OpenAPI compiler for CLI integration tests
        working-directory: openapi
        run: go build -o ../target/debug/poolster-openapi .
      - name: Validate recipe schema
        run: cargo test -p poolster-cli combined_optional_recipe_validates_actual_json_schema -- --ignored
      - name: Resolve local references
        run: cargo test -p poolster-cli --test local_references -- --ignored
      - name: Verify migration
        run: cargo test -p poolster-cli --test migration -- --ignored
  ejection:
    name: Rebuild and execute ejected CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recipe schema validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Build OpenAPI compiler for CLI integration tests
        working-directory: openapi
        run: go build -o ../target/debug/poolster-openapi .
      - name: Verify editable renderer rebuild
        run: cargo test -p poolster-cli eject::tests::rebuilt_ejected_renderer_consumes_custom_source -- --ignored
  openapi:
    name: OpenAPI compiler tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
  workspace:
    name: Build generator and export SDK fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recipe schema validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Build OpenAPI compiler for CLI integration tests
        working-directory: openapi
        run: go build -o ../target/debug/poolster-openapi .
      - name: Verify language output structure and regeneration
        run: |
          python scripts/test-layout-audit.py
          python scripts/test-language-output-audit.py
          cargo build -p poolster-cli --locked
          python scripts/language-output-audit.py --binary target/debug/poolster --output "$RUNNER_TEMP/poolster-language-output" --openapi crates/cli/tests/fixtures/pets.yaml --graphql-schema scripts/fixtures/language-output/schema.graphql --graphql-operations scripts/fixtures/language-output/operations.graphql
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: language-output-audit
          path: ${{ runner.temp }}/poolster-language-output/report.json
          if-no-files-found: ignore
      - name: Export compiled generator binaries
        uses: actions/upload-artifact@v7
        with:
          name: generator-binaries
          path: |-
            target/debug/poolster
            target/debug/poolster-openapi
          retention-days: 1
      - name: Export shared native runtime contract fixture
        env:
          POOLSTER_RUNTIME_EXPORT: ${{ runner.temp }}/runtime-contract-fixture
        run: cargo test -p poolster --features all-plugins --test runtime_conformance --locked
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-contract-fixture
          path: ${{ runner.temp }}/runtime-contract-fixture
          include-hidden-files: true
          retention-days: 1
      - name: Generate checksum-pinned public contracts for every SDK target
        env:
          POOLSTER_BINARY: ${{ github.workspace }}/target/debug/poolster
          POOLSTER_PUBLIC_CONTRACT_ROOT: ${{ runner.temp }}/public-contract-fixtures
        run: bash scripts/test-public-contracts.sh generate
      - uses: actions/upload-artifact@v7
        with:
          name: public-contract-fixtures
          path: ${{ runner.temp }}/public-contract-fixtures
          include-hidden-files: true
          retention-days: 1
      - name: Generate cross-language SDK fixture once
        run: target/debug/poolster generate crates/cli/tests/fixtures/pets.yaml --output "$RUNNER_TEMP/generated-sdk-fixture" --language rust,typescript,go,python,php,java,csharp,elixir,ruby,swift --name "CI Pets" --sdk-version 1.0.0 --color never
      - uses: actions/upload-artifact@v7
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
          include-hidden-files: true
          retention-days: 1
  native-runtime:
    uses: ./.github/workflows/native-conformance.yml
  delivery:
    name: Delivery, API artifacts and release examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: workspace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recipe schema validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - uses: actions/download-artifact@v8
        with:
          name: generator-binaries
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/poolster target/debug/poolster-openapi
      - uses: actions/download-artifact@v8
        with:
          name: runtime-contract-fixture
          path: ${{ runner.temp }}/runtime-contract-fixture
      - name: Install pinned TypeScript compiler
        run: npm install --prefix "$RUNNER_TEMP/poolster-ts-runtime" --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Verify local delivery generation drift and previews
        run: node packages/internal/sdk-delivery-test/delivery.mjs --mode local --binary "$GITHUB_WORKSPACE/target/debug/poolster"
      - name: Verify installed TypeScript ESM package and consumer types
        env:
          POOLSTER_PACKAGE_FIXTURE: ${{ runner.temp }}/runtime-contract-fixture/sdk/typescript
          POOLSTER_TSC_JS: ${{ runner.temp }}/poolster-ts-runtime/node_modules/typescript/lib/tsc.js
        run: node --test packages/internal/runtime-contract/package-consumer.test.mjs
      - name: Verify portable API artifacts
        run: |
          target/debug/poolster generate --config examples/api-artifacts/poolster.json
          POOLSTER_COLLECTION=examples/api-artifacts/generated/postman/widgets.postman_collection.json POOLSTER_ENVIRONMENT=examples/api-artifacts/generated/postman/widgets.postman_environment.json python packages/internal/postman-check/check.py
          (cd examples/api-artifacts/generated/terraform && go mod tidy && go test ./... && go build ./...)
          target/debug/poolster generate --config examples/api-artifacts/poolster.json --check --format json
      - name: Verify release examples
        run: python scripts/check-release-examples.py
  generated-sdk:
    name: Validate generated ${{ matrix.language }} SDK
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Rust
            path: rust
            runner: ubuntu-latest
          - language: TypeScript
            path: typescript
            runner: ubuntu-latest
          - language: Go
            path: go
            runner: ubuntu-latest
          - language: Python
            path: python
            runner: ubuntu-latest
          - language: PHP
            path: php
            runner: ubuntu-latest
          - language: Java
            path: java
            runner: ubuntu-latest
          - language: C#
            path: csharp
            runner: ubuntu-latest
          - language: Elixir
            path: elixir
            runner: ubuntu-latest
          - language: Ruby
            path: ruby
            runner: ubuntu-latest
          - language: Swift
            path: swift
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Swift 6 toolchain for native probes
        if: matrix.language == 'Swift'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer swift --version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: runtime-contract-fixture
          path: ${{ runner.temp }}/runtime-contract-fixture
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'Rust'
        with:
          key: ${{ github.job }}-${{ matrix.path }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install explicit TypeScript compiler for the runtime probe
        if: matrix.language == 'TypeScript'
        run: |
          npm install --prefix "$RUNNER_TEMP/poolster-runtime-ts" --no-audit --no-fund typescript@5.9.3
          echo "POOLSTER_TSC_JS=$RUNNER_TEMP/poolster-runtime-ts/node_modules/typescript/lib/tsc.js" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        if: matrix.language == 'Go' || matrix.language == 'Swift'
        with:
          go-version: 1.25.7
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'PHP'
        with:
          php-version: "8.2"
          tools: composer:v2
      - uses: actions/setup-java@v6
        if: matrix.language == 'Java'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'C#'
        with:
          dotnet-version: 8.0.x
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'Elixir'
        with:
          otp-version: "27.0"
          elixir-version: 1.17.3
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'Ruby'
        with:
          ruby-version: "3.3"
      - name: Initialize Hex for the generated Elixir runtime probe
        if: matrix.language == 'Elixir'
        run: mix local.hex --force && mix local.rebar --force
      - uses: actions/download-artifact@v8
        with:
          name: public-contract-fixtures
          path: ${{ runner.temp }}/public-contract-fixtures
      - name: Compile pinned public contracts with the native language toolchain
        env:
          POOLSTER_PUBLIC_CONTRACT_ROOT: ${{ runner.temp }}/public-contract-fixtures
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/poolster-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/poolster-swift-cache/swiftpm
        run: bash scripts/test-public-contracts.sh check "${{ matrix.path }}"
      - name: Validate generated SDK
        working-directory: ${{ runner.temp }}/generated-sdk-fixture/${{ matrix.path }}
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/poolster-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/poolster-swift-cache/swiftpm
        run: |
          case "${{ matrix.language }}" in
            Rust) cargo test ;;
            TypeScript) npm install --ignore-scripts && npm run build ;;
            Go) go test ./... ;;
            Python) python -m compileall -q src && PYTHONPATH=src python -c 'import ci_pets_sdk' ;;
            PHP) find src -name '*.php' -print0 | xargs -0 -n1 php -l ;;
            Java) mvn --batch-mode --no-transfer-progress -q -DskipTests compile ;;
            C#) dotnet build --configuration Release --disable-build-servers -p:UseSharedCompilation=false ;;
            Elixir) mix deps.get && mix compile --warnings-as-errors ;;
            Ruby) find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c ;;
            Swift) swift build --disable-sandbox ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Python' || matrix.language == 'Swift' || matrix.language == 'Elixir' || matrix.language == 'PHP' || matrix.language == 'Java' || matrix.language == 'C#'
      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'Python' || matrix.language == 'Swift' || matrix.language == 'Elixir' || matrix.language == 'PHP' || matrix.language == 'Java' || matrix.language == 'C#'
        with:
          key: ${{ github.job }}-${{ matrix.path }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify native Python multipart sync and async HTTP bytes
        if: matrix.language == 'Python'
        run: |
          python -m pip install --disable-pip-version-check 'httpx==0.28.1'
          POOLSTER_TEST_PYTHON=python3 cargo test -p poolster-plugin-python native_multipart_sync_async_preserve_mime_and_retry_bytes -- --ignored
      - name: Verify generated Java retry parsers
        if: matrix.language == 'Java'
        run: |
          cargo test -p poolster-plugin-java generated_retry_parsers_execute_with_jdk -- --ignored
          cargo test -p poolster-plugin-java native_webhook_verification_executes_canonical_vectors -- --ignored
          cargo test -p poolster-plugin-java native_generated_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-java native_models_preserve_alias_union_and_unknown_enum_wire_values -- --ignored
          cargo test -p poolster-plugin-java native_omitted_and_null_presence_roundtrip -- --ignored
          cargo test -p poolster-plugin-java native_multipart_http_bytes_preserve_unicode_falsy_and_binary -- --ignored
          cargo test -p poolster-plugin-java native_multipart_complex_json_and_repeated_arrays -- --ignored
          cargo test -p poolster-plugin-java native_oauth_cache_singleflight_replay_origin_and_interruption -- --ignored
          cargo test -p poolster-plugin-java native_call_scopes_preserve_headers_timeouts_and_original_client -- --ignored
      - name: Verify generated C# retry parser
        if: matrix.language == 'C#'
        run: |
          cargo test -p poolster-plugin-csharp generated_retry_parser_executes_with_dotnet -- --ignored
          cargo test -p poolster-plugin-csharp generated_sse_framing_executes_with_dotnet -- --ignored
          cargo test -p poolster-plugin-csharp native_webhook_verification_executes_canonical_vectors -- --ignored
          cargo test -p poolster-plugin-csharp native_generated_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-csharp native_models_preserve_alias_union_and_unknown_enum_wire_values -- --ignored
          cargo test -p poolster-plugin-csharp native_omitted_and_null_presence_roundtrip -- --ignored
          cargo test -p poolster-plugin-csharp native_multipart_http_bytes_preserve_unicode_falsy_and_binary -- --ignored
          cargo test -p poolster-plugin-csharp native_multipart_complex_json_and_repeated_arrays -- --ignored
          cargo test -p poolster-plugin-csharp native_oauth_cache_singleflight_replay_origin_and_cancellation -- --ignored
          cargo test -p poolster-plugin-csharp native_call_scopes_preserve_headers_and_cancel_timeout_without_mutation -- --ignored
      - name: Verify all native PHP probes
        if: matrix.language == 'PHP'
        env:
          POOLSTER_PHP_AUTOLOAD: ${{ runner.temp }}/generated-sdk-fixture/php/vendor/autoload.php
        run: |
          composer install --working-dir="$RUNNER_TEMP/generated-sdk-fixture/php" --no-interaction --no-progress
          cargo test -p poolster-plugin-php -- --ignored
      - name: Verify all native Elixir probes
        if: matrix.language == 'Elixir'
        env:
          POOLSTER_ELIXIR_NATIVE_PROJECT: ${{ runner.temp }}/generated-sdk-fixture/elixir
        run: cargo test -p poolster-plugin-elixir -- --ignored
      - name: Verify native Swift middleware models pagination and cancellation
        if: matrix.language == 'Swift'
        run: cargo test -p poolster-plugin-swift -- --ignored
      - name: Verify complex OpenAPI contract through native Swift SDK
        if: matrix.language == 'Swift'
        env:
          POOLSTER_OPENAPI_BIN: ${{ github.workspace }}/target/debug/poolster-openapi
        run: |
          (cd openapi && go build -o ../target/debug/poolster-openapi .)
          cargo test -p poolster --features all-plugins --test complex_contract -- --ignored
      - name: Verify native C# URL pagination
        if: matrix.language == 'C#'
        run: cargo test -p poolster-plugin-csharp native_url_pages_reject_unsafe_origins_preserve_auth_and_cancel_lazily -- --ignored
      - name: Verify generated Rust operation tests
        if: matrix.language == 'Rust'
        run: |
          cargo test -p poolster-plugin-rust native_generated_rust_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-rust native_url_pages_preserve_origin_auth_and_raw_error_responses -- --ignored
          cargo test -p poolster-plugin-rust native_standard_webhook_vectors_execute -- --ignored
          cargo test -p poolster-plugin-rust native_oauth_singleflight_replay_and_dropped_refresh_are_safe -- --ignored
          cargo test -p poolster-plugin-rust native_unknown_union_roundtrips_and_default_decoding_remains_strict -- --ignored
          cargo test -p poolster-plugin-rust native_nested_future_enum_absent_null_and_unknown_fields_roundtrip -- --ignored
          cargo test -p poolster-plugin-rust native_multipart_buffered_parts_preserve_bytes_and_safe_retries -- --ignored
      - name: Execute generated public operations against shared runtime scenarios
        run: node packages/internal/runtime-contract/runner.mjs "${{ matrix.path }}" "$RUNNER_TEMP/runtime-contract-fixture/sdk/${{ matrix.path }}"
  node-build:
    name: Build shared Node addon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node packages/npm/generate-plugins.mjs --check
      - run: node packages/npm/sdk/scripts/build-native.mjs
      - run: go build -o ../target/debug/poolster-openapi .
        working-directory: openapi
      - name: Upload addon and compiler
        uses: actions/upload-artifact@v7
        with:
          name: node-sdk-native
          path: |-
            packages/npm/sdk/native/poolster_node.node
            target/debug/poolster-openapi
          retention-days: 1
  node-sdk:
    name: Node SDK / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: node-build
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
          - 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: node-sdk-native
          path: .
      - name: Restore compiler executable permission
        run: chmod +x target/debug/poolster-openapi
      - name: Install pinned GraphQL runtime probe dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/poolster-node-graphql" --ignore-scripts --no-audit --no-fund typescript@5.9.3 graphql@16.14.2
          echo "POOLSTER_GRAPHQL_TEST_NODE_MODULES=$RUNNER_TEMP/poolster-node-graphql/node_modules" >> "$GITHUB_ENV"
      - name: Execute SDK tests
        run: npm test --prefix packages/npm/sdk
  passed:
    name: CI passed
    if: always()
    needs:
      - kafka
      - checks
      - rust-checks
      - rust-tests
      - cli-integration
      - ejection
      - openapi
      - workspace
      - native-runtime
      - delivery
      - generated-sdk
      - node-build
      - node-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('CI did not pass: ' + ', '.join(failed))
          PYTHON
