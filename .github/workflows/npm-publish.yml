name: Publish release packages

on:
  workflow_dispatch:
    inputs:
      publish_unplugin:
        description: Also publish a separately versioned unplugin release
        type: boolean
        default: false
      recovery_run:
        description: Original fully validated release run ID (npm recovery only)
        type: string
        default: ''
      recovery_tag:
        description: Immutable release tag for recovery
        type: string
        default: ''
      windows_only:
        description: Rebuild only the Windows native artifacts
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: poolster-release-publication
  cancel-in-progress: false

jobs:
  kafka:
    if: inputs.recovery_run == ''
    uses: ./.github/workflows/kafka-conformance.yml

  verify:
    if: inputs.recovery_run == ''
    name: Verify release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Install schema validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Verify Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Compile and execute generated GraphQL packages
        run: |
          npm install --prefix "$RUNNER_TEMP/poolster-graphql-runtime" --no-audit --no-fund typescript@5.9.3 graphql@16.14.2
          export POOLSTER_TSC_JS="$RUNNER_TEMP/poolster-graphql-runtime/node_modules/typescript/lib/tsc.js"
          export POOLSTER_GRAPHQL_JS="$RUNNER_TEMP/poolster-graphql-runtime/node_modules/graphql/index.js"
          cargo test -p poolster-plugin-typescript --test graphql_native --test graphql_release --test graphql_scalars --locked -- --include-ignored
          cargo test -p poolster-plugin-rust --test graphql_native --locked -- --include-ignored
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
      - name: Run generated SDK contract suite
        run: cargo test -p poolster --features all-plugins --test sdk_to_mock_contract -- --ignored
      - name: Build Poolster and OpenAPI sidecar
        run: |
          cargo build -p poolster-cli --locked
          (cd openapi && go build -o ../target/debug/poolster-openapi .)
      - name: Verify Node embedding and plugins
        env:
          POOLSTER_GRAPHQL_TEST_NODE_MODULES: ${{ runner.temp }}/poolster-graphql-runtime/node_modules
        run: |
          node packages/npm/sdk/scripts/build-native.mjs
          node packages/npm/generate-plugins.mjs --check
          npm test --prefix packages/npm/sdk
      - name: Compile generated TypeScript with Rust add-ons
        env:
          POOLSTER_EXAMPLE_OUTPUT: ${{ runner.temp }}/poolster-node-mixed
        run: |
          node examples/node-embedded/native-contracts.mjs
          npm install --prefix "$POOLSTER_EXAMPLE_OUTPUT/web" --ignore-scripts --no-audit --no-fund
          npm run build --prefix "$POOLSTER_EXAMPLE_OUTPUT/web"
          node packages/npm/sdk/test-support/assert-generated-runtime.mjs "$POOLSTER_EXAMPLE_OUTPUT/web"
      - name: Verify release examples
        run: python scripts/check-release-examples.py
      - name: Test publication recovery
        run: |
          python scripts/test-publish-crates.py
          python scripts/test-publish-npm.py
          python scripts/test-kafka-conformance.py
      - name: Generate cross-language SDK fixture
        run: >-
          target/debug/poolster generate crates/cli/tests/fixtures/pets.yaml
          --output "$RUNNER_TEMP/generated-sdk-fixture"
          --language rust,typescript,go,python,php,java,csharp,elixir,ruby,swift
          --name "CI Pets" --sdk-version 1.0.0 --color never
      - uses: actions/upload-artifact@v7
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
          include-hidden-files: true
          retention-days: 1

  generated-sdk:
    name: Validate generated ${{ matrix.language }} SDK
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: Rust, path: rust, runner: ubuntu-latest }
          - { language: TypeScript, path: typescript, runner: ubuntu-latest }
          - { language: Go, path: go, runner: ubuntu-latest }
          - { language: Python, path: python, runner: ubuntu-latest }
          - { language: PHP, path: php, runner: ubuntu-latest }
          - { language: Java, path: java, runner: ubuntu-latest }
          - { language: C#, path: csharp, runner: ubuntu-latest }
          - { language: Elixir, path: elixir, runner: ubuntu-latest }
          - { language: Ruby, path: ruby, runner: ubuntu-latest }
          - { language: Swift, path: swift, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdk-fixture
          path: generated-sdk-fixture
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'Rust'
        with:
          key: ${{ github.job }}-${{ matrix.path }}
          workspaces: generated-sdk-fixture/rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        if: matrix.language == 'TypeScript'
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        if: matrix.language == 'Go'
        with:
          go-version: '1.25.7'
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'PHP'
        with:
          php-version: '8.2'
      - uses: actions/setup-java@v6
        if: matrix.language == 'Java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'C#'
        with:
          dotnet-version: '8.0.x'
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'Elixir'
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'Ruby'
        with:
          ruby-version: '3.3'
      - name: Select Swift 6 toolchain
        if: matrix.language == 'Swift'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer swift --version
      - name: Validate generated SDK
        working-directory: generated-sdk-fixture/${{ matrix.path }}
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/poolster-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/poolster-swift-cache/swiftpm
        run: |
          case "${{ matrix.language }}" in
            Rust) cargo test ;;
            TypeScript) npm install --ignore-scripts && npm run build ;;
            Go) go test ./... ;;
            Python) python -m compileall -q src && PYTHONPATH=src python -c 'import ci_pets_sdk' ;;
            PHP) find src -name '*.php' -print0 | xargs -0 -n1 php -l ;;
            Java) mvn --batch-mode --no-transfer-progress -q -DskipTests compile ;;
            C#) dotnet build --configuration Release ;;
            Elixir) mix deps.get && mix compile --warnings-as-errors ;;
            Ruby) find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c ;;
            Swift) swift build --disable-sandbox ;;
          esac

  native:
    if: inputs.recovery_run == ''
    name: Build ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"runner":"windows-latest","platform":"win32-x64-msvc","target":"x86_64-pc-windows-msvc"}]' || '[{"runner":"macos-14","platform":"darwin-arm64","target":"aarch64-apple-darwin"},{"runner":"macos-15-intel","platform":"darwin-x64","target":"x86_64-apple-darwin"},{"runner":"ubuntu-22.04","platform":"linux-x64-gnu","target":"x86_64-unknown-linux-gnu"},{"runner":"windows-latest","platform":"win32-x64-msvc","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo test -p poolster-cli --locked
      - run: node --test packages/npm/cli/test/launcher.test.cjs
      - run: node packages/npm/cli/scripts/build-platform.mjs ${{ matrix.platform }}
      - run: node packages/npm/cli/scripts/smoke-native.mjs ${{ matrix.platform }}
      - run: node packages/npm/sdk/scripts/build-platform.mjs ${{ matrix.platform }}
      - run: node packages/npm/sdk/scripts/smoke-platform.mjs ${{ matrix.platform }}
      - run: node packages/npm/cli/scripts/smoke-split.mjs ${{ matrix.platform }}
      - run: node packages/python/scripts/build-wheel.mjs ${{ matrix.platform }}
      - name: Pack native package
        working-directory: packages/npm/platform/cli/${{ matrix.platform }}
        run: npm pack --ignore-scripts
      - name: Pack SDK native package
        working-directory: packages/npm/platform/node/${{ matrix.platform }}
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: native-${{ matrix.platform }}
          path: packages/npm/platform/cli/${{ matrix.platform }}/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: sdk-native-${{ matrix.platform }}
          path: packages/npm/platform/node/${{ matrix.platform }}/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: python-${{ matrix.platform }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  launchers:
    if: inputs.recovery_run == ''
    name: Pack Node launchers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node --test packages/npm/cli/test/launcher.test.cjs
      - run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - name: Pack CLI
        working-directory: packages/npm/cli
        run: npm pack --ignore-scripts
      - name: Pack SDK
        working-directory: packages/npm/sdk
        run: npm pack --ignore-scripts
      - name: Test and pack independent bundler integration
        working-directory: packages/integrations/unplugin
        run: |
          npm test
          npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: node-unplugin
          path: packages/integrations/unplugin/*.tgz
          if-no-files-found: error
      - name: Pack language plugins
        run: |
          node packages/npm/generate-plugins.mjs --check
          for package in packages/npm/plugins/*/package.json packages/npm/inputs/*/package.json packages/npm/plugins-all/package.json; do
            (cd "$(dirname "$package")" && npm pack --ignore-scripts)
          done
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: node-packages
          path: packages/npm/cli/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: node-sdk
          path: packages/npm/sdk/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: node-plugins
          path: |
            packages/npm/plugins/*/*.tgz
            packages/npm/inputs/*/*.tgz
            packages/npm/plugins-all/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [verify, generated-sdk, native, launchers, kafka]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.windows_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-artifacts/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: sdk-native-*
          path: release-artifacts/sdk-native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: node-packages
          path: release-artifacts/cli
      - uses: actions/download-artifact@v8
        with:
          name: node-sdk
          path: release-artifacts/sdk
      - uses: actions/download-artifact@v8
        with:
          name: node-plugins
          path: release-artifacts/node-plugins
      - uses: actions/download-artifact@v8
        with:
          name: node-unplugin
          path: release-artifacts/unplugin
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Select npm distribution channel
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) echo "NPM_DIST_TAG=alpha" >> "$GITHUB_ENV" ;;
            *) echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - name: Verify release version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$(node -p "require('./packages/npm/cli/package.json').version")"
          test "$tag" = "$(node -p "require('./packages/npm/sdk/package.json').version")"
          for package in packages/npm/plugins/*/package.json packages/npm/inputs/*/package.json packages/npm/plugins-all/package.json; do
            test "$tag" = "$(node -p "require('./$package').version")"
          done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify npm supports trusted publishing
        run: node -e 'const {execSync} = require("node:child_process"); const [major, minor, patch] = execSync("npm --version", {encoding:"utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'
      - name: Publish packages with partial-release recovery
        run: >-
          python scripts/publish-npm.py --tag "$NPM_DIST_TAG"
          release-artifacts/native/*.tgz release-artifacts/sdk-native/*.tgz
          release-artifacts/cli/*.tgz release-artifacts/sdk/*.tgz
          release-artifacts/node-plugins

      - name: Publish independent unplugin release when requested
        if: inputs.publish_unplugin
        run: python scripts/publish-npm.py --tag "$NPM_DIST_TAG" release-artifacts/unplugin/*.tgz

  publish-crates:
    name: Publish Rust SDK to crates.io
    needs: [verify, generated-sdk, native, launchers, kafka]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.windows_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: poolster-crates-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Authenticate to crates.io through trusted publishing
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish SDK dependencies and facade
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: python scripts/publish-crates.py --tag "$GITHUB_REF_NAME"

  publish-python:
    name: Publish to PyPI
    needs: [verify, generated-sdk, native, launchers, kafka]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.windows_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: release-artifacts/python
          merge-multiple: true
      - name: Verify release version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'from pathlib import Path; import re; source = Path("packages/python/setup.py").read_text(); print(re.search(r"version=\"([^\"]+)\"", source).group(1))')"
          python -m pip install --disable-pip-version-check 'packaging==25.0'
          python -c 'import sys; from packaging.version import Version; assert Version(sys.argv[1]) == Version(sys.argv[2]), f"release version mismatch: {sys.argv[1]} != {sys.argv[2]}"' "$tag" "$version"
      - name: Publish platform-native wheels
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: release-artifacts/python
          skip-existing: true

  recover-npm:
    name: Recover npm publication
    if: inputs.recovery_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RECOVERY_TAG: ${{ inputs.recovery_tag }}
      RECOVERY_RUN: ${{ inputs.recovery_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify original release source and successful build gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          [[ "$RECOVERY_RUN" =~ ^[0-9]+$ ]]
          export RELEASE_SHA="$(git rev-parse "$RECOVERY_TAG^{commit}")"
          gh run view "$RECOVERY_RUN" --json headSha,name,jobs > "$RUNNER_TEMP/original-release.json"
          python - "$RUNNER_TEMP/original-release.json" <<'PYCODE'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          assert run['headSha'] == os.environ['RELEASE_SHA'], 'Artifact source does not match release tag'
          assert run['name'] == 'Publish release packages', 'Unexpected source workflow'
          builds = [j for j in run['jobs'] if not j['name'].startswith('Publish ')]
          assert builds and all(j['conclusion'] == 'success' for j in builds), 'Release build gates did not pass'
          PYCODE
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          pattern: native-*
          path: release-artifacts/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          pattern: sdk-native-*
          path: release-artifacts/sdk-native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          name: node-packages
          path: release-artifacts/cli
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          name: node-sdk
          path: release-artifacts/sdk
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          name: node-plugins
          path: release-artifacts/node-plugins
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          name: node-unplugin
          path: release-artifacts/unplugin
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Select npm distribution channel
        run: |
          case "${RECOVERY_TAG#v}" in
            *-*) echo "NPM_DIST_TAG=alpha" >> "$GITHUB_ENV" ;;
            *) echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - name: Verify release version
        run: |
          tag="${RECOVERY_TAG#v}"
          test "$tag" = "$(node -p "require('./packages/npm/cli/package.json').version")"
          test "$tag" = "$(node -p "require('./packages/npm/sdk/package.json').version")"
          for package in packages/npm/plugins/*/package.json packages/npm/inputs/*/package.json packages/npm/plugins-all/package.json; do
            test "$tag" = "$(node -p "require('./$package').version")"
          done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify npm supports trusted publishing
        run: node -e 'const {execSync} = require("node:child_process"); const [major, minor, patch] = execSync("npm --version", {encoding:"utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'
      - name: Publish packages with partial-release recovery
        run: >-
          python scripts/publish-npm.py --tag "$NPM_DIST_TAG"
          release-artifacts/native/*.tgz release-artifacts/sdk-native/*.tgz
          release-artifacts/cli/*.tgz release-artifacts/sdk/*.tgz
          release-artifacts/node-plugins
      - name: Publish independent unplugin release when requested
        if: inputs.publish_unplugin
        run: python scripts/publish-npm.py --tag "$NPM_DIST_TAG" release-artifacts/unplugin/*.tgz
