name: npm launcher checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test packages/npm/cli/test/launcher.test.cjs
      - run: npm pack --dry-run --ignore-scripts
        working-directory: packages/npm/cli
      - run: npm pack --dry-run --ignore-scripts
        working-directory: packages/npm/sdk
